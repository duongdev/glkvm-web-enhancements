<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GLKVM Web Enhancements</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1014;
      --card: #181a21;
      --card-hover: #1d2029;
      --border: #262a34;
      --text: #eceef2;
      --muted: #8a93a3;
      --faint: #5d6675;
      --accent: #2f7bf6;
      --ok: #2ea043;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 340px; padding: 18px 18px 14px;
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex; align-items: center; gap: 11px;
      padding-bottom: 16px; margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    .titles { flex: 1; min-width: 0; }
    h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
    .subtitle { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .version {
      font-size: 10px; font-weight: 600; color: var(--muted);
      padding: 3px 7px; border: 1px solid var(--border); border-radius: 999px;
    }
    .group { margin-bottom: 16px; }
    .group:last-of-type { margin-bottom: 0; }
    .group-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
      color: var(--faint); padding: 0 2px 7px;
    }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 13px; border: 1px solid var(--border); border-radius: 11px;
      background: var(--card); margin-bottom: 8px; cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .row:last-child { margin-bottom: 0; }
    .row:hover { background: var(--card-hover); border-color: #2f3440; }
    .row .text { flex: 1; min-width: 0; }
    .row .label { font-size: 13px; font-weight: 600; }
    .row .desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
    kbd {
      font: 600 10.5px -apple-system, "Segoe UI", sans-serif;
      background: #23262f; border: 1px solid #333845; border-radius: 5px;
      padding: 1px 5px; color: #cdd3de; white-space: nowrap;
    }
    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .slider {
      position: absolute; inset: 0; pointer-events: none; background: #3a3f4b;
      border-radius: 22px; transition: background .15s;
    }
    .slider::before {
      content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: transform .15s;
      box-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(16px); }
    input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--border);
    }
    .note { font-size: 10.5px; color: var(--faint); line-height: 1.45; flex: 1; }
    .saved { color: var(--ok); opacity: 0; transition: opacity .2s; font-size: 11px; font-weight: 600; }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-128.png" alt="" />
    <div class="titles">
      <h1>GLKVM Web Enhancements</h1>
      <div class="subtitle">Tweaks for the GLKVM web console</div>
    </div>
    <span class="version">v1.0.1</span>
  </header>

  <div class="group">
    <div class="group-label">Display</div>

    <label class="row" for="collapseToolbar">
      <div class="text">
        <div class="label">Collapse toolbar by default</div>
        <div class="desc">Hide the top toolbar on load for a larger viewport.</div>
      </div>
      <span class="switch"><input type="checkbox" id="collapseToolbar" /><span class="slider"></span></span>
    </label>

    <label class="row" for="showStats">
      <div class="text">
        <div class="label">Show network consumption</div>
        <div class="desc">Show total downloaded / uploaded next to the bitrate.</div>
      </div>
      <span class="switch"><input type="checkbox" id="showStats" /><span class="slider"></span></span>
    </label>

    <label class="row" for="showBarFullscreen">
      <div class="text">
        <div class="label">Show status bar in fullscreen</div>
        <div class="desc">Keep the bottom bar (speaker / mic / stats) visible while in fullscreen.</div>
      </div>
      <span class="switch"><input type="checkbox" id="showBarFullscreen" /><span class="slider"></span></span>
    </label>
  </div>

  <div class="group">
    <div class="group-label">Audio</div>

    <label class="row" for="enableSpeaker">
      <div class="text">
        <div class="label">Enable speaker by default</div>
        <div class="desc">Turn the remote audio output on when the page loads.</div>
      </div>
      <span class="switch"><input type="checkbox" id="enableSpeaker" /><span class="slider"></span></span>
    </label>

    <label class="row" for="enableMic">
      <div class="text">
        <div class="label">Enable microphone by default</div>
        <div class="desc">Auto-enable mic on load — prompts for access and starts capturing.</div>
      </div>
      <span class="switch"><input type="checkbox" id="enableMic" /><span class="slider"></span></span>
    </label>
  </div>

  <div class="group">
    <div class="group-label">Keyboard</div>

    <label class="row" for="lockKeyboard">
      <div class="text">
        <div class="label">Capture keyboard shortcuts</div>
        <div class="desc">In fullscreen, send <kbd>⌘R</kbd> <kbd>⌘W</kbd> <kbd>⌘T</kbd> and other shortcuts to the remote instead of the local browser.</div>
      </div>
      <span class="switch"><input type="checkbox" id="lockKeyboard" /><span class="slider"></span></span>
    </label>
  </div>

  <footer>
    <span class="note">Applies on next page load (network stats applies live).</span>
    <span class="saved" id="saved">Saved</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
